{% extends "base.html" %}
{% block content %}
<div class="card center">
  <h1>Saved!</h1>
  <p>Created <b>{{ name }}</b> with {{ count }} tracks in your Spotify library.</p>
  {% if url %}<a class="btn" href="{{ url }}" target="_blank" rel="noopener">Open in Spotify</a>{% endif %}
  <p><a href="{{ url_for('index') }}">Sort another playlist</a></p>
</div>
{% endblock %}
